name: "mcp-injection-scanner"
description: "Scan agent config files and MCP tool definitions for prompt injection; fail on drift or critical findings."
inputs:
  mode:
    description: "repo | scan | drift"
    default: "repo"
  fail-on:
    description: "none | info | warning | critical"
    default: "critical"
  baseline:
    description: "Pinned baseline path (drift mode)"
    default: ".mcp-scan/baseline.json"
  tools-json:
    description: "Saved tools/list JSON files to scan without launching servers (scan/drift modes), one per line (legacy whitespace-separated paths also accepted)"
    default: ""
  changed-since:
    description: "Git ref; in repo mode only scan agent files changed since it (use the PR base sha)"
    default: ""
  sarif-output:
    description: "Where to write SARIF"
    default: "mcpscan.sarif"
  redact-evidence:
    description: "Omit raw evidence, free-form finding text, and report notes from CI output"
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Run mcpscan
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        TOOLS_JSON: ${{ inputs.tools-json }}
        CHANGED_SINCE: ${{ inputs.changed-since }}
        SARIF: ${{ inputs.sarif-output }}
        REDACT_EVIDENCE: ${{ inputs.redact-evidence }}
      run: bash "$GITHUB_ACTION_PATH/ci/run-offline-scan.sh" "$GITHUB_ACTION_PATH/scanner/run.py"
