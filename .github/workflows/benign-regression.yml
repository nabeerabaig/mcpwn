name: Benign scanner regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests
      - run: python bench/evaluate_benign.py --max-flagged 0
      - run: python scanner/run.py audit bench/audit-manifest.json --format json
      - name: Generate audit dashboard
        if: ${{ !cancelled() }}
        run: python scanner/run.py audit bench/audit-manifest.json --format html --output mcp-audit.html
      - name: Upload audit dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-audit-dashboard
          path: mcp-audit.html
          if-no-files-found: ignore
