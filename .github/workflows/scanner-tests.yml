name: Scanner tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject tracked Python bytecode
        shell: bash
        run: |
          tracked=$(git ls-files -- ':(glob)**/*.pyc' ':(glob)**/*.pyo' ':(glob)**/__pycache__/**')
          if [[ -n "$tracked" ]]; then
            printf 'Remove generated Python cache files from Git:\n%s\n' "$tracked" >&2
            exit 1
          fi
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run isolated prompt-injection benchmark
        run: python -m unittest discover -s tests -p "test_prompt_injection_benchmark.py" -v
